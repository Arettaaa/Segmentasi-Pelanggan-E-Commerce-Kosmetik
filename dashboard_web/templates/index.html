<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SegmentIQ — Laporan Segmentasi Pengguna</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>
  /* set tema sebelum render agar tidak berkedip */
  (function(){var t=null;try{t=localStorage.getItem('siq-theme')}catch(e){}
   if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
   document.documentElement.dataset.theme=t;})();
</script>
</head>
<body>

<header class="appbar">
  <div class="brand">
    <div class="mark"><i data-lucide="bar-chart-3"></i></div>
    <div class="bt">
      <b>Segmentasi Pengguna · E-Commerce Kosmetik</b>
      <small id="meta-line">Memuat…</small>
    </div>
  </div>
  <div class="actions">
    <button class="ibtn" id="btn-refresh" title="Muat ulang data dari PostgreSQL"><i data-lucide="refresh-cw"></i><span>Muat ulang</span></button>
    <button class="ibtn" id="btn-theme" title="Ganti tema"><i data-lucide="moon"></i></button>
  </div>
</header>

<div class="filterbar">
  <div class="fl"><i data-lucide="filter"></i><span>Filter</span></div>
  <div class="slicer" id="slicer">
    <button class="sbtn" id="slicer-btn" aria-haspopup="listbox" aria-expanded="false">
      <span class="sk">Segmen</span><span class="sv" id="slicer-val">Semua</span><i data-lucide="chevron-down"></i>
    </button>
    <div class="spop hide" id="slicer-pop" role="listbox"></div>
  </div>
  <div class="chips" id="chips"></div>
  <button class="link hide" id="btn-reset"><i data-lucide="eraser"></i>Reset filter</button>
  <div class="fr">
    <span class="tag" title="Periode transaksi pada dataset"><i data-lucide="calendar-range"></i>Periode data: <b id="tag-period">—</b></span>
    <span class="tag" title="Satuan harga & zona waktu yang dipakai analisis"><i data-lucide="ruler"></i><span id="tag-unit">—</span></span>
    <span class="tag"><i data-lucide="database"></i>PostgreSQL · segmentasi</span>
  </div>
</div>

<main class="canvas" id="canvas">
  <div id="loader" class="state"><div class="spin"></div><p>Memuat data dari PostgreSQL…</p></div>
  <div id="fatal" class="state hide"></div>
  <div id="page" class="grid hide"></div>
</main>

<nav class="pagetabs" id="pagetabs" aria-label="Halaman laporan"></nav>

<div id="tip" class="toast hide"></div>

<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
